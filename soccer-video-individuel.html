    margin: 0 auto;

  .video-item {
    background: #131a2b;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    overflow: hidden;
  }
  .video-item video {
    width: 100%;
    height: 400px;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .empty-msg {
    text-align: center;
    color: #888;
    padding: 60px 20px;
    font-size: 16px;
    grid-column: 1 / -1;
